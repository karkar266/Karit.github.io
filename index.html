<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Karit – Deezer Search</title>
    <style>
        :root {
            --bg-dark: #0a1128;
            --bg-sidebar: #0d1535;
            --bg-player: #111d44;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --accent: #3b82f6;
            --accent-rgb: 59, 130, 246;
            --heart-red: #e74c3c;
            --sidebar-width: 220px;
            --player-height: 70px;
            --tile-cover-size: 120px;
            --border-radius: 8px;
            --transition-speed: 0.2s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        .sidebar {
            position: fixed; top: 0; left: 0; width: var(--sidebar-width);
            height: calc(100vh - var(--player-height)); background-color: var(--bg-sidebar);
            display: flex; flex-direction: column; z-index: 50;
            border-right: 1px solid rgba(255,255,255,0.05); padding-top: 24px;
        }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; padding: 0 16px; flex-grow: 1; }
        .sidebar-item {
            padding: 12px 16px; border-radius: var(--border-radius); cursor: pointer;
            font-size: 15px; font-weight: 500; color: var(--text-secondary);
            transition: all var(--transition-speed) ease; white-space: nowrap; display: block;
        }
        .sidebar-item:hover { color: var(--text-primary); background-color: rgba(255,255,255,0.04); }
        .sidebar-item.active {
            color: var(--text-primary); font-weight: 700; background-color: rgba(255,255,255,0.06);
            position: relative;
        }
        .sidebar-item.active::after {
            content: ''; position: absolute; left: 0; bottom: 6px; width: 24px; height: 2px;
            background-color: var(--accent); border-radius: 1px;
        }
        .sidebar-bottom { padding: 16px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: auto; }
        .sidebar-bottom .sidebar-item { font-size: 14px; color: var(--text-tertiary); }

        .mobile-nav {
            display: none; position: fixed; top: 0; left: 0; right: 0; height: 48px;
            background: var(--bg-sidebar); z-index: 60; align-items: center; justify-content: space-around;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .mobile-nav-item {
            font-size: 13px; color: var(--text-secondary); cursor: pointer; padding: 8px 10px;
            border-radius: 6px; transition: 0.2s; white-space: nowrap;
        }
        .mobile-nav-item.active { color: var(--text-primary); font-weight: 700; background: rgba(255,255,255,0.06); }

        .main-content {
            margin-left: var(--sidebar-width); margin-bottom: var(--player-height);
            height: calc(100vh - var(--player-height)); overflow-y: auto; padding: 40px 32px;
            scroll-behavior: smooth;
        }
        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .liked-section { margin-bottom: 32px; cursor: pointer; }
        .liked-section:active { transform: scale(0.98); }
        .liked-card {
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 16px; padding: 24px 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: box-shadow var(--transition-speed) ease, transform var(--transition-speed) ease;
        }
        .liked-section:hover .liked-card {
            box-shadow: 0 12px 32px rgba(var(--accent-rgb), 0.35), 0 8px 24px rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }
        .liked-title { font-size: 28px; font-weight: 700; color: #fff; }
        .play-circle {
            width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.2s; pointer-events: none;
        }
        .liked-section:hover .play-circle { background: rgba(255,255,255,0.35); transform: scale(1.08); }

        .tracks-section { margin-top: 8px; }
        .tracks-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%;
        }
        @media (max-width: 1100px) { .tracks-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 800px) {
            .tracks-grid { grid-template-columns: repeat(2, 1fr); }
            :root { --tile-cover-size: 90px; }
        }

        .track-tile {
            background: rgba(255,255,255,0.03); border-radius: var(--border-radius); padding: 12px;
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column;
            align-items: center; text-align: center; border: 2px solid transparent; position: relative;
        }
        .track-tile:hover { background: rgba(255,255,255,0.07); transform: translateY(-2px); }
        .track-tile.playing {
            border-color: var(--accent); background: rgba(var(--accent-rgb), 0.08);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.15);
        }
        .track-tile.playing::before {
            content: '🔊'; position: absolute; top: 8px; right: 10px; font-size: 14px; z-index: 3;
        }
        .track-cover {
            width: var(--tile-cover-size); height: var(--tile-cover-size);
            background-color: #fff; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .track-cover img { width: 100%; height: 100%; object-fit: cover; }
        .cover-question { font-size: calc(var(--tile-cover-size) * 0.5); color: #000; font-weight: bold; }
        .track-title {
            font-size: 15px; font-weight: 600; margin-top: 10px; line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .track-artist {
            font-size: 13px; color: var(--text-secondary); margin-top: 4px;
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* Поиск */
        .search-container {
            display: flex; gap: 10px; margin-bottom: 20px; max-width: 500px;
        }
        .search-input {
            flex-grow: 1; padding: 12px 16px; border-radius: 30px; border: none;
            background: rgba(255,255,255,0.1); color: white; font-size: 16px; outline: none;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.5); }
        .search-btn {
            background: var(--accent); color: white; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .search-btn:hover { background: #2563eb; transform: scale(1.04); }

        .player {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-height);
            background: var(--bg-player); z-index: 100; display: grid;
            grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 24px;
            border-top: 1px solid rgba(255,255,255,0.06); box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        }
        .player-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .player-cover-mini {
            width: 42px; height: 42px; background: #fff; border-radius: 3px; overflow: hidden;
            display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000;
        }
        .player-cover-mini img { width: 100%; height: 100%; object-fit: cover; }
        .player-track-details { display: flex; flex-direction: column; overflow: hidden; }
        .player-track-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-track-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-controls { display: flex; align-items: center; gap: 16px; justify-self: center; }
        .ctrl-btn {
            background: none; border: none; cursor: pointer; padding: 6px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
            transition: 0.2s; color: var(--text-primary);
        }
        .ctrl-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .ctrl-btn:hover { transform: scale(1.15); background: rgba(255,255,255,0.06); }
        .ctrl-btn.play-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.08); }
        .ctrl-btn.play-btn svg { width: 28px; height: 28px; }
        .ctrl-btn.like-btn.liked svg { fill: var(--heart-red); animation: heartPop 0.35s ease; }
        .ctrl-btn.shuffle-active { color: var(--accent); }
        @keyframes heartPop {
            0%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(0.9)}100%{transform:scale(1)}
        }

        .player-right { display: flex; align-items: center; gap: 16px; justify-self: end; }
        .player-time { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
        .player-volume { display: flex; align-items: center; gap: 6px; }
        input[type="range"] {
            -webkit-appearance: none; width: 80px; height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 2px; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; background: white; border-radius: 50%;
        }

        @media (max-width: 600px) {
            .sidebar { display: none; }
            .mobile-nav { display: flex; }
            .main-content { margin-left: 0; margin-top: 48px; padding: 20px 16px; }
            :root { --player-height: 60px; }
            .player { padding: 0 12px; }
            .player-controls { gap: 10px; }
            .ctrl-btn { width: 36px; height: 36px; }
            .ctrl-btn svg { width: 20px; height: 20px; }
            .ctrl-btn.play-btn { width: 42px; height: 42px; }
            .ctrl-btn.play-btn svg { width: 24px; height: 24px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <span class="sidebar-item active" data-page="main">Главная</span>
            <span class="sidebar-item" data-page="search">Поиск</span>
            <span class="sidebar-item" data-page="upload">Загрузить с устройства</span>
        </nav>
        <div class="sidebar-bottom">
            <span class="sidebar-item" data-page="account">Аккаунт</span>
        </div>
    </aside>

    <nav class="mobile-nav" id="mobileNav">
        <span class="mobile-nav-item active" data-page="main">Главная</span>
        <span class="mobile-nav-item" data-page="search">Поиск</span>
        <span class="mobile-nav-item" data-page="upload">Загрузки</span>
        <span class="mobile-nav-item" data-page="account">Аккаунт</span>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="page active" id="page-main">
            <div class="liked-section" id="likedSection">
                <div class="liked-card">
                    <div class="liked-text"><span class="liked-title">Любимое</span></div>
                    <div class="play-circle" id="likedPlayCircle">
                        <svg id="likedIconPlay" width="28" height="28" viewBox="0 0 24 24" fill="white"><polygon points="6,4 20,12 6,20"/></svg>
                        <svg id="likedIconPause" width="28" height="28" viewBox="0 0 24 24" fill="white" style="display:none;"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
                    </div>
                </div>
            </div>
            <div class="tracks-section"><div class="tracks-grid" id="tracksGrid"></div></div>
        </div>

        <div class="page" id="page-search">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск по Deezer (например, Eminem)" />
                <button id="searchBtn" class="search-btn">Найти</button>
            </div>
            <div class="tracks-grid" id="searchResultsGrid"></div>
        </div>

        <div class="page" id="page-upload">
            <div class="upload-page-content" style="display:flex; flex-direction:column; align-items:center; gap:20px; min-height:50vh; justify-content:center;">
                <p style="font-size:18px;color:var(--text-secondary);">Загрузите свои аудиофайлы</p>
                <button class="upload-btn" id="uploadBtn" style="background:var(--accent); color:white; border:none; padding:14px 28px; border-radius:30px; font-weight:700; cursor:pointer;">Выбрать файлы</button>
                <input type="file" id="fileInput" class="hidden-input" accept="audio/*" multiple>
                <div class="uploaded-list" id="uploadedList" style="width:100%;max-width:500px;display:flex;flex-direction:column;gap:8px;"></div>
            </div>
        </div>

        <div class="page" id="page-account">
            <div class="placeholder-page" style="display:flex; align-items:center; justify-content:center; height:60vh; font-size:28px; color:var(--text-tertiary);">Аккаунт</div>
        </div>
    </main>

    <footer class="player" id="player">
        <div class="player-info">
            <div class="player-cover-mini" id="playerCoverMini">?</div>
            <div class="player-track-details">
                <span class="player-track-title" id="playerTitle">—</span>
                <span class="player-track-artist" id="playerArtist">—</span>
            </div>
        </div>
        <div class="player-controls">
            <button class="ctrl-btn" id="btnShuffle"><svg viewBox="0 0 24 24"><path d="M18 4l3 3-3 3M21 7H9a4 4 0 000 8h6a4 4 0 010 8H3M18 20l3-3-3-3"/></svg></button>
            <button class="ctrl-btn" id="btnPrev"><svg viewBox="0 0 24 24"><polygon points="16,4 8,12 16,20"/><rect x="4" y="4" width="2" height="16"/></svg></button>
            <button class="ctrl-btn play-btn" id="btnPlay">
                <svg id="iconPlay" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
                <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
            </button>
            <button class="ctrl-btn" id="btnNext"><svg viewBox="0 0 24 24"><polygon points="8,4 16,12 8,20"/><rect x="18" y="4" width="2" height="16"/></svg></button>
            <button class="ctrl-btn like-btn" id="btnLike"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
        </div>
        <div class="player-right">
            <div class="player-time"><span id="timeCurrent">00:00</span><span>/</span><span id="timeDuration">00:00</span></div>
            <div class="player-volume">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>
    </footer>

    <script>
        (function() {
            // Прокси для Deezer (обход CORS)
            const CORS_PROXY = 'https://corsproxy.io/?'; 
            const DEEZER_API = 'https://api.deezer.com/search?q=';

            let tracks = [];
            const INITIAL_PLACEHOLDER_COUNT = 8;

            function initPlaceholderTracks() {
                tracks = [];
                for (let i = 0; i < INITIAL_PLACEHOLDER_COUNT; i++) {
                    tracks.push({
                        id: i,
                        title: 'null',
                        artist: '',
                        cover: '#ffffff',
                        url: null,
                        isPlaceholder: true,
                    });
                }
            }
            initPlaceholderTracks();

            const likedTrackIds = new Set();
            let currentPlaylist = [];
            let currentPlaylistIndex = -1;
            let isPlaying = false;
            let shuffleMode = false;

            const audio = new Audio();
            audio.preload = 'metadata';
            audio.volume = 0.8;

            // DOM элементы
            const sidebarItems = document.querySelectorAll('.sidebar-item');
            const mobileNavItems = document.querySelectorAll('.mobile-nav-item');
            const pages = document.querySelectorAll('.page');
            const tracksGrid = document.getElementById('tracksGrid');
            const searchResultsGrid = document.getElementById('searchResultsGrid');
            const likedSection = document.getElementById('likedSection');
            const btnPlay = document.getElementById('btnPlay');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnLike = document.getElementById('btnLike');
            const btnShuffle = document.getElementById('btnShuffle');
            const playerTitle = document.getElementById('playerTitle');
            const playerArtist = document.getElementById('playerArtist');
            const playerCoverMini = document.getElementById('playerCoverMini');
            const timeCurrent = document.getElementById('timeCurrent');
            const timeDuration = document.getElementById('timeDuration');
            const volumeSlider = document.getElementById('volumeSlider');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const uploadedList = document.getElementById('uploadedList');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const iconPlay = document.getElementById('iconPlay');
            const iconPause = document.getElementById('iconPause');
            const likedIconPlay = document.getElementById('likedIconPlay');
            const likedIconPause = document.getElementById('likedIconPause');

            let currentPage = 'main';

            // Навигация
            function switchPage(pageName) {
                currentPage = pageName;
                sidebarItems.forEach(item => item.classList.toggle('active', item.dataset.page === pageName));
                mobileNavItems.forEach(item => item.classList.toggle('active', item.dataset.page === pageName));
                pages.forEach(page => page.classList.toggle('active', page.id === 'page-' + pageName));
                document.getElementById('mainContent').scrollTop = 0;
            }
            [sidebarItems, mobileNavItems].forEach(group => group.forEach(el => el.addEventListener('click', () => switchPage(el.dataset.page))));

            // Рендер плиток
            function renderTrackGrid() {
                const sorted = [...tracks].sort((a,b) => a.isPlaceholder ? 1 : -1);
                tracksGrid.innerHTML = '';
                sorted.forEach(track => {
                    const tile = createTileElement(track, true);
                    tracksGrid.appendChild(tile);
                });
                updatePlayingTileHighlight();
            }

            function createTileElement(track, isMainGrid = false) {
                const tile = document.createElement('div');
                tile.className = 'track-tile';
                tile.dataset.trackId = track.id;
                const coverContent = track.cover && track.cover.startsWith('http') ?
                    `<img src="${track.cover}" alt="" />` :
                    `<span class="cover-question">?</span>`;
                tile.innerHTML = `
                    <div class="track-cover" style="background-color:${track.cover.startsWith('#') ? track.cover : '#fff'}">${coverContent}</div>
                    <div class="track-title">${escapeHtml(track.title)}</div>
                    ${track.artist ? `<div class="track-artist">${escapeHtml(track.artist)}</div>` : ''}
                `;
                tile.addEventListener('click', () => {
                    if (isMainGrid) {
                        const idx = tracks.findIndex(t => t.id == track.id);
                        if (idx !== -1) playTrackFromAll(idx);
                    } else {
                        const searchTiles = [...searchResultsGrid.children];
                        const idx = searchTiles.findIndex(t => t.dataset.trackId == track.id);
                        if (idx !== -1) playSearchResult(idx);
                    }
                });
                return tile;
            }

            function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

            function updatePlayingTileHighlight() {
                document.querySelectorAll('.track-tile').forEach(t => t.classList.remove('playing'));
                if (currentPlaylistIndex >= 0 && currentPlaylist.length > 0) {
                    const track = currentPlaylist[currentPlaylistIndex];
                    if (track) {
                        const tile = document.querySelector(`.track-tile[data-track-id="${track.id}"]`);
                        if (tile) tile.classList.add('playing');
                    }
                }
            }

            // Плеер
            function playTrack(playlistIndex) {
                if (playlistIndex < 0 || playlistIndex >= currentPlaylist.length) return;
                currentPlaylistIndex = playlistIndex;
                const track = currentPlaylist[currentPlaylistIndex];
                if (!track) return;
                updatePlayerUI(track);
                updatePlayingTileHighlight();
                updateLikeButtonState(track);
                if (track.url) {
                    audio.src = track.url;
                    audio.play().then(() => { isPlaying = true; updatePlayStates(); }).catch(() => { isPlaying = false; updatePlayStates(); });
                } else {
                    audio.pause();
                    audio.src = '';
                    isPlaying = false;
                    updatePlayStates();
                }
            }

            function updatePlayerUI(track) {
                playerCoverMini.innerHTML = track.cover && track.cover.startsWith('http') ? `<img src="${track.cover}">` : '?';
                playerTitle.textContent = track.title || '—';
                playerArtist.textContent = track.artist || '—';
                timeCurrent.textContent = '00:00';
                timeDuration.textContent = '00:00';
            }

            function updatePlayStates() {
                iconPlay.style.display = isPlaying ? 'none' : 'block';
                iconPause.style.display = isPlaying ? 'block' : 'none';
                if (isPlaying && isPlayingLikedPlaylist()) {
                    likedIconPlay.style.display = 'none';
                    likedIconPause.style.display = 'block';
                } else {
                    likedIconPlay.style.display = 'block';
                    likedIconPause.style.display = 'none';
                }
                btnPlay.title = isPlaying ? 'Пауза' : 'Воспроизвести';
            }

            function updateLikeButtonState(track) {
                const liked = track && likedTrackIds.has(track.id);
                btnLike.classList.toggle('liked', liked);
                btnLike.title = liked ? 'Убрать из Любимых' : 'Добавить в Любимые';
            }

            function updateShuffleBtn() {
                btnShuffle.classList.toggle('shuffle-active', shuffleMode);
            }

            function togglePlay() {
                if (currentPlaylistIndex < 0 || currentPlaylist.length === 0) {
                    playLikedRandom();
                    return;
                }
                const track = currentPlaylist[currentPlaylistIndex];
                if (!track || !track.url) {
                    isPlaying = false;
                    updatePlayStates();
                    return;
                }
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    audio.play().then(() => { isPlaying = true; }).catch(() => { isPlaying = false; });
                }
                updatePlayStates();
            }

            function nextTrack() {
                if (currentPlaylist.length === 0) return;
                const next = shuffleMode ? Math.floor(Math.random() * currentPlaylist.length) :
                    (currentPlaylistIndex + 1) % currentPlaylist.length;
                playTrack(next);
            }

            function prevTrack() {
                if (currentPlaylist.length === 0) return;
                const prev = shuffleMode ? Math.floor(Math.random() * currentPlaylist.length) :
                    (currentPlaylistIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
                playTrack(prev);
            }

            function toggleLike() {
                if (currentPlaylistIndex < 0) return;
                const track = currentPlaylist[currentPlaylistIndex];
                if (!track) return;
                if (likedTrackIds.has(track.id)) likedTrackIds.delete(track.id);
                else likedTrackIds.add(track.id);
                updateLikeButtonState(track);
            }

            function toggleShuffle() {
                shuffleMode = !shuffleMode;
                updateShuffleBtn();
            }

            function isPlayingLikedPlaylist() {
                return currentPlaylist.length > 0 && currentPlaylist.every(t => likedTrackIds.has(t.id));
            }

            function playLikedRandom() {
                const liked = tracks.filter(t => likedTrackIds.has(t.id));
                if (liked.length === 0) return;
                const shuffled = [...liked].sort(() => Math.random() - 0.5);
                currentPlaylist = shuffled;
                currentPlaylistIndex = 0;
                playTrack(0);
                if (currentPage !== 'main') switchPage('main');
            }

            function playTrackFromAll(index) {
                currentPlaylist = [...tracks];
                currentPlaylistIndex = index;
                playTrack(index);
            }

            // 🔍 Поиск через Deezer (через CORS-прокси)
            async function searchDeezer(query) {
                try {
                    const url = CORS_PROXY + encodeURIComponent(DEEZER_API + encodeURIComponent(query));
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.error) return [];
                    return data.data.map(track => ({
                        id: 'dz_' + track.id,
                        title: track.title,
                        artist: track.artist.name,
                        cover: track.album.cover_medium,
                        url: track.preview, // 30-сек превью
                        isPlaceholder: false,
                    }));
                } catch (err) {
                    console.error('Ошибка Deezer:', err);
                    return [];
                }
            }

            function renderSearchResults(results) {
                searchResultsGrid.innerHTML = '';
                if (results.length === 0) {
                    searchResultsGrid.innerHTML = '<p style="color:var(--text-tertiary)">Ничего не найдено</p>';
                    return;
                }
                results.forEach(track => {
                    const tile = createTileElement(track, false);
                    searchResultsGrid.appendChild(tile);
                });
                window._searchResults = results;
            }

            function playSearchResult(index) {
                const results = window._searchResults;
                if (!results || index < 0 || index >= results.length) return;
                currentPlaylist = [...results];
                currentPlaylistIndex = index;
                playTrack(index);
                const track = results[index];
                if (!tracks.find(t => t.id === track.id)) {
                    tracks.unshift(track);
                    if (currentPage === 'main') renderTrackGrid();
                }
            }

            searchBtn.addEventListener('click', async () => {
                const query = searchInput.value.trim();
                if (query) {
                    searchBtn.disabled = true;
                    searchBtn.textContent = 'Поиск...';
                    const results = await searchDeezer(query);
                    renderSearchResults(results);
                    searchBtn.disabled = false;
                    searchBtn.textContent = 'Найти';
                }
            });
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchBtn.click();
            });

            // Обработчики
            likedSection.addEventListener('click', () => {
                if (isPlayingLikedPlaylist()) togglePlay();
                else playLikedRandom();
            });
            btnPlay.addEventListener('click', togglePlay);
            btnNext.addEventListener('click', nextTrack);
            btnPrev.addEventListener('click', prevTrack);
            btnLike.addEventListener('click', toggleLike);
            btnShuffle.addEventListener('click', toggleShuffle);

            audio.addEventListener('loadedmetadata', () => timeDuration.textContent = formatTime(audio.duration));
            audio.addEventListener('timeupdate', () => timeCurrent.textContent = formatTime(audio.currentTime));
            audio.addEventListener('ended', nextTrack);
            audio.addEventListener('play', () => { isPlaying = true; updatePlayStates(); });
            audio.addEventListener('pause', () => { isPlaying = false; updatePlayStates(); });
            audio.addEventListener('error', () => { isPlaying = false; updatePlayStates(); });

            function formatTime(s) {
                if (!isFinite(s) || s < 0) return '00:00';
                const m = Math.floor(s / 60), sec = Math.floor(s % 60);
                return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
            }

            volumeSlider.addEventListener('input', e => audio.volume = parseFloat(e.target.value));
            audio.volume = parseFloat(volumeSlider.value);

            // Загрузка файлов
            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
                files.forEach(file => {
                    const url = URL.createObjectURL(file);
                    tracks.unshift({
                        id: Date.now() + Math.random(),
                        title: file.name.replace(/\.[^/.]+$/, '') || 'Без названия',
                        artist: '',
                        cover: '#ffffff',
                        url,
                        isPlaceholder: false,
                        fileName: file.name,
                    });
                });
                renderTrackGrid();
                updateUploadedList();
                fileInput.value = '';
            });

            function updateUploadedList() {
                const real = tracks.filter(t => !t.isPlaceholder);
                uploadedList.innerHTML = real.length ? '' : '<p style="color:var(--text-tertiary)">Загруженных треков пока нет</p>';
                real.forEach(track => {
                    const div = document.createElement('div');
                    div.className = 'uploaded-item';
                    div.style.cssText = 'background:rgba(255,255,255,0.04);padding:10px 16px;border-radius:8px;display:flex;align-items:center;gap:10px;color:var(--text-secondary);';
                    div.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(track.title)}</span><span style="color:var(--text-tertiary);font-size:12px;">${escapeHtml(track.fileName||'')}</span>`;
                    uploadedList.appendChild(div);
                });
            }

            // Старт
            renderTrackGrid();
            updateUploadedList();
            updatePlayStates();
            updateLikeButtonState(null);
            updateShuffleBtn();
            switchPage('main');
        })();
    </script>
</body>
</html>
